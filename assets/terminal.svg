<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-label="C# Developer Profile">
<defs>
  <linearGradient id="border-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="460">
    <stop offset="0" stop-color="#a855f7"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono { font-family: 'Fira Code','JetBrains Mono','SF Mono',Consolas,'Courier New',monospace; font-size: 14px; }
    .kw   { fill: #c084fc; }   /* keyword     */
    .type { fill: #38bdf8; }   /* type/class  */
    .ns   { fill: #22d3ee; }   /* namespace   */
    .str  { fill: #86efac; }   /* string      */
    .bool { fill: #f472b6; }   /* bool value  */
    .prop { fill: #e2e8f0; }   /* property    */
    .sym  { fill: #94a3b8; }   /* symbols     */
    .cmt  { fill: #4b5563; }   /* comment     */
    .pmt  { fill: #a855f7; }   /* prompt $    */
    .cmd  { fill: #6b7280; }   /* command     */
    .ln-1  { animation: fadein 0.4s 0.2s  both; }
    .ln-2  { animation: fadein 0.4s 0.5s  both; }
    .ln-3  { animation: fadein 0.4s 0.8s  both; }
    .ln-4  { animation: fadein 0.4s 1.1s  both; }
    .ln-5  { animation: fadein 0.4s 1.5s  both; }
    .ln-6  { animation: fadein 0.4s 1.8s  both; }
    .ln-7  { animation: fadein 0.4s 2.1s  both; }
    .ln-8  { animation: fadein 0.4s 2.5s  both; }
    .ln-9  { animation: fadein 0.4s 2.9s  both; }
    .ln-10 { animation: fadein 0.4s 3.3s  both; }
    .ln-11 { animation: fadein 0.4s 3.7s  both; }
    .ln-12 { animation: fadein 0.4s 4.1s  both; }
    .ln-13 { animation: fadein 0.4s 4.5s  both; }
    .ln-14 { animation: fadein 0.4s 4.9s  both; }
    .ln-15 { animation: fadein 0.4s 5.3s  both; }
    .ln-16 { animation: fadein 0.4s 5.7s  both; }
    .ln-17 { animation: fadein 0.4s 6.0s  both; }
    .ln-18 { animation: fadein 0.4s 6.3s  both; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</defs>

<!-- Background -->
<rect x="1" y="1" width="758" height="458" rx="14" fill="#0d0d16" stroke="#1e1b2e" stroke-width="1.5"/>

<!-- Title bar -->
<rect x="1" y="1" width="758" height="38" rx="14" fill="#12101c"/>
<rect x="1" y="20" width="758" height="19" fill="#12101c"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57" opacity=".9"/>
<circle cx="42" cy="20" r="6" fill="#febc2e" opacity=".9"/>
<circle cx="62" cy="20" r="6" fill="#28c840" opacity=".9"/>
<text x="380" y="25" text-anchor="middle" class="mono" font-size="12" fill="#4b5563">Profile.cs — arda@server</text>

<!-- ── C# Code ── -->

<!-- 1: comment -->
<text x="30" y="68" class="mono cmt ln-1">// Backend Server Developer · github.com/arda6401</text>

<!-- 2: blank line (spacer) -->

<!-- 3: using System -->
<g class="ln-2">
  <text x="30"  y="98"  class="mono kw">using</text>
  <text x="80"  y="98"  class="mono sym"> System;</text>
</g>

<!-- 4: using Collections -->
<g class="ln-3">
  <text x="30"  y="118" class="mono kw">using</text>
  <text x="80"  y="118" class="mono sym"> System.Collections.Generic;</text>
</g>

<!-- 5: blank spacer -->

<!-- 6: namespace -->
<g class="ln-4">
  <text x="30"  y="150" class="mono kw">namespace</text>
  <text x="119" y="150" class="mono ns"> Arda</text>
  <text x="155" y="150" class="mono sym">.</text>
  <text x="163" y="150" class="mono ns">Profile</text>
</g>

<!-- 7: { -->
<text x="30" y="170" class="mono sym ln-5">{</text>

<!-- 8: public class Developer -->
<g class="ln-6">
  <text x="48"  y="192" class="mono kw">public class</text>
  <text x="148" y="192" class="mono type"> Developer</text>
</g>

<!-- 9: { -->
<text x="48" y="212" class="mono sym ln-7">{</text>

<!-- 10: Name -->
<g class="ln-8">
  <text x="66"  y="234" class="mono kw">public string</text>
  <text x="174" y="234" class="mono prop"> Name</text>
  <text x="216" y="234" class="mono sym"> =&gt;</text>
  <text x="240" y="234" class="mono str"> "arda"</text>
  <text x="296" y="234" class="mono sym">;</text>
</g>

<!-- 11: Role -->
<g class="ln-9">
  <text x="66"  y="256" class="mono kw">public string</text>
  <text x="174" y="256" class="mono prop"> Role</text>
  <text x="216" y="256" class="mono sym"> =&gt;</text>
  <text x="240" y="256" class="mono str"> "Backend Server Developer"</text>
  <text x="492" y="256" class="mono sym">;</text>
</g>

<!-- 12: Location -->
<g class="ln-10">
  <text x="66"  y="278" class="mono kw">public string</text>
  <text x="174" y="278" class="mono prop"> Location</text>
  <text x="258" y="278" class="mono sym"> =&gt;</text>
  <text x="282" y="278" class="mono str"> "Turkey"</text>
  <text x="348" y="278" class="mono sym">;</text>
</g>

<!-- 13: Stack -->
<g class="ln-11">
  <text x="66"  y="300" class="mono kw">public string</text>
  <text x="174" y="300" class="mono sym">[]</text>
  <text x="190" y="300" class="mono prop"> Stack</text>
  <text x="240" y="300" class="mono sym"> =&gt; new[] {</text>
  <text x="346" y="300" class="mono str"> "C#"</text>
  <text x="380" y="300" class="mono sym">,</text>
  <text x="388" y="300" class="mono str"> "Unity"</text>
  <text x="444" y="300" class="mono sym">,</text>
  <text x="452" y="300" class="mono str"> "C++"</text>
  <text x="492" y="300" class="mono sym">,</text>
  <text x="500" y="300" class="mono str"> "Python"</text>
  <text x="560" y="300" class="mono sym"> };</text>
</g>

<!-- 14: Building -->
<g class="ln-12">
  <text x="66"  y="322" class="mono kw">public string</text>
  <text x="174" y="322" class="mono prop"> Building</text>
  <text x="258" y="322" class="mono sym"> =&gt;</text>
  <text x="282" y="322" class="mono str"> "Multiplayer Game Servers"</text>
  <text x="534" y="322" class="mono sym">;</text>
</g>

<!-- 15: RunsOwnServers -->
<g class="ln-13">
  <text x="66"  y="344" class="mono kw">public bool</text>
  <text x="156" y="344" class="mono prop"> RunsOwnServers</text>
  <text x="296" y="344" class="mono sym"> =&gt;</text>
  <text x="320" y="344" class="mono bool"> true</text>
  <text x="354" y="344" class="mono sym">;</text>
</g>

<!-- 16: } inner -->
<text x="48" y="364" class="mono sym ln-14">}</text>

<!-- 17: } outer -->
<text x="30" y="384" class="mono sym ln-15">}</text>

<!-- 18: prompt -->
<g class="ln-16">
  <text x="30"  y="420" class="mono pmt">$</text>
  <text x="46"  y="420" class="mono cmd"> dotnet run --project ./Server</text>
  <rect x="296" y="406" width="8.5" height="16" fill="#22d3ee" class="cursor ln-17"/>
</g>

<!-- Animated gradient border -->
<rect x="1" y="1" width="758" height="458" rx="14" fill="none"
      stroke="url(#border-grad)" stroke-width="2"
      stroke-dasharray="180 2800" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" from="0" to="-2980" dur="8s" repeatCount="indefinite"/>
</rect>
</svg>
