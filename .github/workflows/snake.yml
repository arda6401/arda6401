name: 🐍 Katkı Yılanı Oluştur

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *" # Her 6 saatte bir güncelle
  workflow_dispatch: # Elle çalıştırma imkânı

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Yılan animasyonunu üret
        uses: Platane/snk@v3
        with:
          github_user_name: arda6464
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: "output" dalına yayımla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
